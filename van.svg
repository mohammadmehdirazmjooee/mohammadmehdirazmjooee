<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="A camper van driving down a road lined with minimal trees" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a76"/>
      <stop offset="0.55" stop-color="#ffd3a5"/>
      <stop offset="1" stop-color="#fff1d6"/>
    </linearGradient>

    <!-- round tree -->
    <g id="t1">
      <rect x="-4" y="-46" width="8" height="46" rx="2" fill="#5b3a29"/>
      <ellipse cx="0" cy="-88" rx="26" ry="44" fill="#2d6a4f"/>
    </g>
    <!-- pine tree -->
    <g id="t2">
      <rect x="-3" y="-30" width="6" height="30" fill="#5b3a29"/>
      <path d="M0 -128 L25 -36 H-25 Z" fill="#40916c"/>
    </g>

    <!-- near trees (one 900px tile) -->
    <g id="nearset">
      <use href="#t1" transform="translate(60 290) scale(1.1)"/>
      <use href="#t2" transform="translate(190 290) scale(1.05)"/>
      <use href="#t1" transform="translate(340 290) scale(0.95)"/>
      <use href="#t2" transform="translate(480 290) scale(1.15)"/>
      <use href="#t1" transform="translate(630 290) scale(1.05)"/>
      <use href="#t2" transform="translate(780 290) scale(1)"/>
    </g>

    <!-- far trees (one 900px tile) -->
    <g id="farset">
      <use href="#t2" transform="translate(30 272) scale(0.55)"/>
      <use href="#t1" transform="translate(120 272) scale(0.5)"/>
      <use href="#t2" transform="translate(240 272) scale(0.6)"/>
      <use href="#t1" transform="translate(340 272) scale(0.55)"/>
      <use href="#t2" transform="translate(450 272) scale(0.5)"/>
      <use href="#t2" transform="translate(560 272) scale(0.6)"/>
      <use href="#t1" transform="translate(680 272) scale(0.5)"/>
      <use href="#t2" transform="translate(790 272) scale(0.55)"/>
      <use href="#t1" transform="translate(865 272) scale(0.5)"/>
    </g>

    <g id="hillset">
      <path d="M0 275 Q110 185 230 245 T450 235 T690 225 T900 275 V300 H0 Z" fill="#e8a07a" opacity="0.55"/>
      <path d="M0 280 Q160 220 320 262 T620 250 T900 280 V300 H0 Z" fill="#d9876a" opacity="0.6"/>
    </g>

    <g id="cloudset" fill="#ffffff" opacity="0.8">
      <g transform="translate(120 70)"><ellipse cx="0" cy="0" rx="46" ry="14"/><ellipse cx="-24" cy="-8" rx="22" ry="12"/><ellipse cx="14" cy="-12" rx="26" ry="14"/></g>
      <g transform="translate(470 45) scale(0.8)"><ellipse cx="0" cy="0" rx="46" ry="14"/><ellipse cx="-24" cy="-8" rx="22" ry="12"/><ellipse cx="14" cy="-12" rx="26" ry="14"/></g>
      <g transform="translate(760 95) scale(0.9)"><ellipse cx="0" cy="0" rx="46" ry="14"/><ellipse cx="-24" cy="-8" rx="22" ry="12"/><ellipse cx="14" cy="-12" rx="26" ry="14"/></g>
    </g>
  </defs>

  <style>
    .clouds { animation: scroll 70s linear infinite; }
    .hills  { animation: scroll 45s linear infinite; }
    .far    { animation: scroll 20s linear infinite; }
    .near   { animation: scroll 6s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-900px); } }

    .dash { animation: dashmove 0.4s linear infinite; }
    @keyframes dashmove { from { transform: translateX(0); } to { transform: translateX(-60px); } }

    .bounce { animation: bounce 0.45s ease-in-out infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }

    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .puff { transform-box: fill-box; transform-origin: center; opacity: 0; animation: puff 1.5s ease-out infinite; }
    .p2 { animation-delay: 0.5s; }
    .p3 { animation-delay: 1s; }
    @keyframes puff {
      0%   { transform: translate(0, 0) scale(0.4); opacity: 0.6; }
      100% { transform: translate(-70px, -20px) scale(1.5); opacity: 0; }
    }

    .glow { animation: glow 4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes glow { from { transform: scale(1); opacity: 0.25; } to { transform: scale(1.12); opacity: 0.4; } }
  </style>

  <!-- sky -->
  <rect width="900" height="360" fill="url(#sky)"/>
  <circle class="glow" cx="700" cy="125" r="78" fill="#ffd166"/>
  <circle cx="700" cy="125" r="48" fill="#ffd166"/>

  <!-- clouds -->
  <g class="clouds">
    <use href="#cloudset"/>
    <use href="#cloudset" x="900"/>
  </g>

  <!-- hills -->
  <g class="hills">
    <use href="#hillset"/>
    <use href="#hillset" x="900"/>
  </g>

  <!-- ground -->
  <rect y="270" width="900" height="90" fill="#6b9a5b"/>

  <!-- far trees -->
  <g opacity="0.5" class="far">
    <use href="#farset"/>
    <use href="#farset" x="900"/>
  </g>

  <!-- near trees -->
  <g class="near">
    <use href="#nearset"/>
    <use href="#nearset" x="900"/>
  </g>

  <!-- road -->
  <rect y="290" width="900" height="56" fill="#3d4250"/>
  <rect y="290" width="900" height="3" fill="#f6efe3" opacity="0.7"/>
  <rect y="343" width="900" height="3" fill="#f6efe3" opacity="0.7"/>
  <rect y="346" width="900" height="14" fill="#5a8a4b"/>
  <g class="dash">
    <line x1="-60" y1="318" x2="960" y2="318" stroke="#f6efe3" stroke-width="4" stroke-dasharray="30 30"/>
  </g>

  <!-- camper van -->
  <g transform="translate(340 222)">
    <g class="bounce">
      <!-- exhaust puffs -->
      <g transform="translate(-4 84)">
        <circle class="puff" r="8" fill="#ffffff"/>
        <circle class="puff p2" r="8" fill="#ffffff"/>
        <circle class="puff p3" r="8" fill="#ffffff"/>
      </g>

      <!-- surfboard + rack -->
      <ellipse cx="85" cy="-12" rx="52" ry="7" fill="#48cae4"/>
      <path d="M40 -12 H130" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
      <rect x="40" y="-5" width="90" height="4" rx="2" fill="#555"/>

      <!-- body -->
      <rect x="28" y="0" width="112" height="16" rx="6" fill="#e9dfcc"/>
      <rect x="0" y="10" width="206" height="78" rx="16" fill="#f6efe3"/>
      <path d="M0 64 H206 V74 H0 Z" fill="#e07a5f"/>

      <!-- windows -->
      <rect x="62" y="24" width="70" height="28" rx="6" fill="#a8dadc"/>
      <path d="M150 22 H190 Q200 22 203 34 L206 52 H150 Z" fill="#a8dadc"/>
      <path d="M140 22 V86" stroke="#cdbfa6" stroke-width="2"/>
      <rect x="12" y="24" width="38" height="28" rx="6" fill="#a8dadc"/>

      <!-- lights + bumper -->
      <circle cx="201" cy="62" r="5" fill="#ffd166"/>
      <rect x="190" y="82" width="20" height="8" rx="4" fill="#8d8d8d"/>
      <rect x="-3" y="80" width="14" height="8" rx="4" fill="#8d8d8d"/>

      <!-- wheel arches + wheels -->
      <circle cx="55" cy="98" r="22" fill="#2b2b2b"/>
      <circle cx="165" cy="98" r="22" fill="#2b2b2b"/>
      <g transform="translate(55 98)">
        <g class="wheel">
          <circle r="18" fill="#1d1d1d"/>
          <circle r="9" fill="#bdbdbd"/>
          <path d="M-9 0 H9 M0 -9 V9" stroke="#666" stroke-width="2"/>
        </g>
      </g>
      <g transform="translate(165 98)">
        <g class="wheel">
          <circle r="18" fill="#1d1d1d"/>
          <circle r="9" fill="#bdbdbd"/>
          <path d="M-9 0 H9 M0 -9 V9" stroke="#666" stroke-width="2"/>
        </g>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
